name: Quality checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/ggf
          AUTH_SECRET: ci-only-secret-with-at-least-32-characters
      - run: npm run prune:production
      - run: npm run audit:production
